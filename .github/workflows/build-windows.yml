name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller pywebview pythonnet
      - name: Install UPX (exe compression)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-win64.zip" -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          "UPX_DIR=$env:GITHUB_WORKSPACE\upx-5.2.0-win64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build single-file executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile `
            --windowed `
            --name OracleTCPMonitor_SingleFile `
            --upx-dir "$env:UPX_DIR" `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module ensurepip `
            --exclude-module pip `
            --exclude-module venv `
            --exclude-module idlelib `
            --exclude-module turtledemo `
            --exclude-module lib2to3 `
            --exclude-module pydoc_data `
            --exclude-module doctest `
            --exclude-module webview.platforms.cocoa `
            --exclude-module webview.platforms.gtk `
            --exclude-module webview.platforms.qt `
            --exclude-module webview.platforms.cef `
            --add-data "targets.json;." `
            --add-data "web\index.html;web" `
            app.py
      - uses: actions/upload-artifact@v4
        with:
          name: OracleTCPMonitor-Windows-x64
          path: dist/OracleTCPMonitor_SingleFile.exe
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OracleTCPMonitor_SingleFile.exe
          body_path: CHANGELOG.md
